name: Center governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: center-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify center governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm ci --prefix missions/plan-and-deliver/scripts

      - name: Verify skill manifest
        run: node missions/plan-and-deliver/scripts/verify-skill-manifest.mjs

      - name: Verify checkpoint steps
        run: node missions/plan-and-deliver/scripts/verify-checkpoint-steps.mjs

      - name: Verify no legacy wire tokens
        run: node missions/plan-and-deliver/scripts/verify-no-legacy-wire-tokens.mjs
